<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In / Register — VÉRRA</title>
  <meta name="description" content="Sign in or register for your VÉRRA botanical hair care account.">
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/storefront.css">
</head>
<body style="background: var(--color-ivory);">

  <header class="site-header">
    <div class="container nav-container" style="justify-content: center;">
      <a href="/index.html" class="brand-logo-wrap" title="VÉRRA Luxury Botanical Haircare">
        <img src="/assets/images/verra_nav_logo.png" alt="VÉRRA" class="brand-logo-img" onerror="this.src='/assets/images/verra_logo.png'">
      </a>
    </div>
  </header>

  <main class="section-padding" style="display: flex; align-items: center; justify-content: center;">
    <div class="container" style="max-width: 480px;">
      
      <div class="card" style="padding: 36px 32px; box-shadow: var(--shadow-card);">
        
        <!-- Tab Headers -->
        <div style="display: flex; border-bottom: 1px solid var(--color-border); margin-bottom: 28px;">
          <button id="tab-login-btn" class="nav-link active" style="flex: 1; text-align: center; padding-bottom: 12px; background: none; border: none; font-size: 0.95rem; cursor: pointer;">
            Sign In
          </button>
          <button id="tab-register-btn" class="nav-link" style="flex: 1; text-align: center; padding-bottom: 12px; background: none; border: none; font-size: 0.95rem; cursor: pointer;">
            Create Account
          </button>
        </div>

        <div id="auth-alert-box" class="alert alert-danger" style="display: none; font-size: 0.85rem;"></div>

        <!-- 1. Sign In Form -->
        <form id="login-form">
          <div class="form-group">
            <label class="form-label" for="login-email">Email Address</label>
            <input type="email" id="login-email" class="form-control" placeholder="name@example.com" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="login-password">Password</label>
            <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
          </div>

          <button type="submit" id="login-submit-btn" class="btn btn-primary btn-block" style="margin-top: 24px; padding: 14px;">
            Sign In to VÉRRA
          </button>
        </form>

        <!-- 2. Register Form -->
        <form id="register-form" style="display: none;">
          <div class="form-group">
            <label class="form-label" for="reg-name">Full Name *</label>
            <input type="text" id="reg-name" class="form-control" placeholder="Priya Sharma" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-email">Email Address *</label>
            <input type="email" id="reg-email" class="form-control" placeholder="priya@example.com" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-password">Password (min 6 characters) *</label>
            <input type="password" id="reg-password" class="form-control" placeholder="••••••••" required minlength="6">
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-phone">Phone Number</label>
            <input type="tel" id="reg-phone" class="form-control" placeholder="+91 98200 12345">
          </div>

          <button type="submit" id="reg-submit-btn" class="btn btn-primary btn-block" style="margin-top: 24px; padding: 14px;">
            Create Patron Account
          </button>
        </form>

        <!-- Quick Demo Credentials Box for College BI Project Review -->
        <div style="margin-top: 32px; padding-top: 20px; border-top: 1px solid var(--color-border); text-align: center;">
          <span style="font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-taupe); font-weight: 700; display: block; margin-bottom: 12px;">
            College Project Quick Access
          </span>
          <div style="display: flex; gap: 8px;">
            <button id="quick-admin-btn" class="btn btn-secondary btn-sm" style="flex: 1; font-size: 0.75rem;">
              Admin Credentials
            </button>
            <button id="quick-cust-btn" class="btn btn-secondary btn-sm" style="flex: 1; font-size: 0.75rem;">
              Customer Credentials
            </button>
          </div>
        </div>

      </div>

      <div style="text-align: center; margin-top: 24px;">
        <a href="/index.html" style="font-size: 0.85rem; color: var(--color-forest);">&larr; Return to Storefront</a>
      </div>

    </div>
  </main>

  <script type="module">
    import { auth } from '/js/auth.js';

    document.addEventListener('DOMContentLoaded', () => {
      const tabLogin = document.getElementById('tab-login-btn');
      const tabRegister = document.getElementById('tab-register-btn');
      const loginForm = document.getElementById('login-form');
      const registerForm = document.getElementById('register-form');
      const alertBox = document.getElementById('auth-alert-box');

      const quickAdminBtn = document.getElementById('quick-admin-btn');
      const quickCustBtn = document.getElementById('quick-cust-btn');

      // Check if URL has ?admin=true or ?mode=register
      const params = new URLSearchParams(window.location.search);
      const redirectUrl = params.get('redirect') || '/index.html';

      if (params.get('mode') === 'register') {
        showRegister();
      }

      tabLogin.onclick = showLogin;
      tabRegister.onclick = showRegister;

      function showLogin() {
        tabLogin.classList.add('active');
        tabRegister.classList.remove('active');
        loginForm.style.display = 'block';
        registerForm.style.display = 'none';
        hideAlert();
      }

      function showRegister() {
        tabRegister.classList.add('active');
        tabLogin.classList.remove('active');
        loginForm.style.display = 'none';
        registerForm.style.display = 'block';
        hideAlert();
      }

      function showAlert(msg) {
        alertBox.textContent = msg;
        alertBox.style.display = 'block';
      }

      function hideAlert() {
        alertBox.style.display = 'none';
      }

      // Quick Credentials Fill
      quickAdminBtn.onclick = () => {
        showLogin();
        document.getElementById('login-email').value = 'admin@verra.com';
        document.getElementById('login-password').value = 'VerraAdmin2026!';
      };

      quickCustBtn.onclick = () => {
        showLogin();
        document.getElementById('login-email').value = 'priya.sharma@example.com';
        document.getElementById('login-password').value = 'Ritual2026!';
      };

      // Handle Login Submit
      loginForm.onsubmit = async (e) => {
        e.preventDefault();
        hideAlert();
        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;
        const btn = document.getElementById('login-submit-btn');

        btn.disabled = true;
        btn.textContent = 'Authenticating...';

        try {
          const res = await auth.login(email, password);
          if (res.success) {
            if (res.user.role === 'admin') {
              window.location.href = redirectUrl.includes('admin') ? redirectUrl : '/admin/index.html';
            } else {
              window.location.href = redirectUrl.includes('admin') ? '/account.html' : redirectUrl;
            }
          } else {
            showAlert(res.message || 'Authentication failed.');
          }
        } catch (err) {
          showAlert(err.message || 'Cannot connect to authentication service.');
        } finally {
          btn.disabled = false;
          btn.textContent = 'Sign In to VÉRRA';
        }
      };

      // Handle Register Submit
      registerForm.onsubmit = async (e) => {
        e.preventDefault();
        hideAlert();
        const name = document.getElementById('reg-name').value.trim();
        const email = document.getElementById('reg-email').value.trim();
        const password = document.getElementById('reg-password').value;
        const phone = document.getElementById('reg-phone').value.trim();
        const btn = document.getElementById('reg-submit-btn');

        btn.disabled = true;
        btn.textContent = 'Creating account...';

        try {
          const res = await auth.register({ name, email, password, phone });
          if (res.success) {
            alert('Welcome to VÉRRA. Your client account has been registered.');
            window.location.href = redirectUrl;
          } else {
            showAlert(res.message || 'Registration failed.');
          }
        } catch (err) {
          showAlert(err.message || 'Registration error.');
        } finally {
          btn.disabled = false;
          btn.textContent = 'Create Patron Account';
        }
      };
    });
  </script>
</body>
</html>
